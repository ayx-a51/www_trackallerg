<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrackAllerg — know your triggers</title>
    <meta name="description" content="TrackAllerg — allergy and symptom tracking, matched against the pollen and weather you were actually in. Coming soon.">
    <meta name="theme-color" content="#E0F5EF">
    <meta property="og:title" content="TrackAllerg — know your triggers">
    <meta property="og:description" content="Allergy and symptom tracking, matched against the pollen and weather you were actually in. Coming soon.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://trackallerg.net/">
    <meta property="og:image" content="https://trackallerg.net/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://trackallerg.net/">
    <link rel="icon" href="icon.png" type="image/png">
    <style>
      :root{
        color-scheme:light;
        --mist:#E0F5EF;
        --ink:#134E4A;
        --teal:#0D9488;
        --body:#3F615B;
        --faint:#5A7A74;
        --line:#BFE3DA;
      }
      *{margin:0;padding:0;box-sizing:border-box}
      body{
        background:var(--mist);
        color:var(--ink);
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        line-height:1.55;
        -webkit-font-smoothing:antialiased;
        min-height:100vh;
        display:flex;
        flex-direction:column;
      }
      img{display:block;max-width:100%}
      a{color:inherit}
      :focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:6px}

      main{
        flex:1;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-align:center;
        padding:clamp(24px,6vw,64px) clamp(20px,5vw,40px);
      }
      .flower{width:clamp(180px,32vw,260px);height:auto}
      .name{
        margin-top:clamp(14px,2.4vw,22px);
        font-size:.85rem;
        font-weight:700;
        letter-spacing:.16em;
        text-transform:uppercase;
        color:var(--faint);
      }
      h1{
        margin-top:.35em;
        font-size:clamp(2.2rem,7vw,3.4rem);
        font-weight:700;
        letter-spacing:-.025em;
        line-height:1.05;
      }
      h1 .t{color:var(--teal)}
      .desc{
        margin-top:1em;
        color:var(--body);
        font-size:clamp(1rem,2.2vw,1.15rem);
        max-width:44ch;
      }
      .pill{
        margin-top:clamp(22px,3.5vw,30px);
        display:inline-block;
        background:var(--ink);
        color:#fff;
        font-size:.8rem;
        font-weight:700;
        letter-spacing:.12em;
        text-transform:uppercase;
        border-radius:99px;
        padding:.65em 1.4em;
      }
      .mail{
        margin-top:clamp(20px,3vw,26px);
        font-weight:600;
        color:var(--teal);
        text-decoration:none;
        border-bottom:2px solid currentColor;
        padding-bottom:1px;
      }
      .mail:hover{color:var(--ink)}

      footer{
        border-top:1px solid var(--line);
        padding:clamp(18px,3vw,26px) clamp(20px,5vw,40px);
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:10px 26px;
        font-size:.88rem;
        color:var(--faint);
      }
      footer a{color:var(--faint);text-decoration:none}
      footer a:hover{color:var(--ink);text-decoration:underline}
    </style>
  </head>
<body>
  <main>
    <img class="flower" src="flower.png" alt="The TrackAllerg flower mark" width="440" height="389">
    <p class="name">TrackAllerg</p>
    <h1>Know your <span class="t">triggers</span>.</h1>
    <p class="desc">Allergy and symptom tracking, matched against the pollen and weather you were actually in &mdash; so the pattern shows up before the next flare does.</p>
    <p class="pill">Coming soon to Android</p>
    <a class="mail" href="mailto:hi@trackallerg.net">hi@trackallerg.net</a>
  </main>
  <footer>
    <a href="privacy-policy.html">Privacy policy</a>
    <a href="account-deletion.html">Account deletion</a>
    <span>&copy; A51</span>
  </footer>
</body>
</html>
