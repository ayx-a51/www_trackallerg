<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrackAllerg — kenne deine Trigger</title>
    <meta name="description" content="TrackAllerg — Allergie- und Symptomtracking, abgeglichen mit Pollen und Wetter, denen du wirklich ausgesetzt warst. Demnächst für Android.">
    <meta name="theme-color" content="#E0F5EF">
    <meta property="og:title" content="TrackAllerg — kenne deine Trigger">
    <meta property="og:description" content="Allergie- und Symptomtracking, abgeglichen mit Pollen und Wetter, denen du wirklich ausgesetzt warst. Demnächst für Android.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="de_DE">
    <meta property="og:url" content="https://trackallerg.net/">
    <meta property="og:image" content="https://trackallerg.net/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://trackallerg.net/">
    <link rel="icon" href="icon.png" type="image/png">
    <style>
      :root{
        color-scheme:light;
        --mist:#E0F5EF;
        --ink:#134E4A;
        --teal:#0D9488;
        --body:#3F615B;
        --faint:#5A7A74;
        --line:#BFE3DA;
      }
      *{margin:0;padding:0;box-sizing:border-box}
      body{
        background:var(--mist);
        color:var(--ink);
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        line-height:1.55;
        -webkit-font-smoothing:antialiased;
        min-height:100vh;
        display:flex;
        flex-direction:column;
      }
      img{display:block;max-width:100%}
      a{color:inherit}
      :focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:6px}

      main{
        flex:1;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-align:center;
        padding:clamp(28px,6vw,64px) clamp(20px,5vw,40px);
      }
      .flower{width:clamp(180px,32vw,260px);height:auto}
      .name{
        margin-top:clamp(22px,3.4vw,32px);
        font-size:1.3rem;
        font-weight:700;
        letter-spacing:.04em;
        color:var(--faint);
      }
      h1{
        margin-top:.85em;
        font-size:clamp(2.1rem,6.6vw,3.4rem);
        font-weight:700;
        letter-spacing:-.025em;
        line-height:1.05;
      }
      h1 .t{color:var(--teal)}
      .desc{
        margin-top:1.4em;
        color:var(--body);
        font-size:clamp(1rem,2.2vw,1.15rem);
        max-width:46ch;
      }
      .pill{
        margin-top:clamp(40px,6vw,56px);
        display:inline-block;
        background:var(--ink);
        color:#fff;
        font-size:.8rem;
        font-weight:700;
        letter-spacing:.12em;
        text-transform:uppercase;
        border-radius:99px;
        padding:.65em 1.4em;
      }
      .mail{
        margin-top:clamp(26px,4vw,36px);
        font-weight:600;
        color:var(--teal);
        text-decoration:none;
      }
      .mail:hover{color:var(--ink)}

      footer{
        border-top:1px solid var(--line);
        padding:clamp(18px,3vw,26px) clamp(20px,5vw,40px);
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:10px 26px;
        font-size:.88rem;
        color:var(--faint);
      }
      footer a{color:var(--faint);text-decoration:none}
      footer a:hover{color:var(--ink);text-decoration:underline}
    </style>
  </head>
<body>
  <main>
    <img class="flower" src="flower.png" alt="Das TrackAllerg-Blumensymbol" width="440" height="389">
    <p class="name">TrackAllerg</p>
    <h1>Kenne deine <span class="t">Trigger</span>.</h1>
    <p class="desc">Allergie- und Symptomtracking, abgeglichen mit Pollen und Wetter, denen du wirklich ausgesetzt warst &mdash; so zeigt sich das Muster, bevor der nächste Schub kommt.</p>
    <p class="pill">Demnächst für Android</p>
    <a class="mail" href="mailto:hi@trackallerg.net">hi@trackallerg.net</a>
  </main>
  <footer>
    <a href="privacy-policy.html">Datenschutzerklärung</a>
    <a href="account-deletion.html">Konto löschen</a>
    <span>&copy; A51</span>
  </footer>
</body>
</html>
